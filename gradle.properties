# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# Increases memory to avoid java.lang.OutOfMemoryError: Java heap space during dexing/compilation.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC

# AndroidX package structure
android.useAndroidX=true

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Gradle performance settings
org.gradle.parallel=true
org.gradle.caching=true
